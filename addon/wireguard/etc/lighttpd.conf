# etc/lighttpd.conf of lite-addon-wireguard (MIT): openccu-lite proxies /addons/wireguard/ to the daemon on
# the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/wireguard" {
    url.redirect = ("" => "/addons/wireguard/")
}
$HTTP["url"] =~ "^/addons/wireguard/" {
    proxy.server = ("/addons/wireguard/" => (("host" => "127.0.0.1", "port" => 8298)))
    server.errorfile-prefix = "/usr/local/addons/wireguard/www/lighttpd-error-"
}
