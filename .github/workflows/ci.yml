name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (keys, config, tunnel, api, package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go test -race ./...

  ui:
    name: ui (svelte-check, vitest, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npx playwright test
        working-directory: ui

  peer:
    name: peer (the official WireGuard tools in docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: WG_DOCKER=1 go test -count=1 -v ./test/peer/

  package:
    name: packages (aarch64, x86_64, armv7l)
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: VERSION=0.0.0-ci scripts/build.sh
      - run: tar tzf dist/wireguard-x86_64-0.0.0-ci.tar.gz | sort
      - run: tar tzf dist/wireguard-x86_64-0.0.0-ci.tar.gz | grep -q '^./wireguard/etc/lighttpd.conf$'
      - run: tar tzf dist/wireguard-x86_64-0.0.0-ci.tar.gz | grep -q '^./openccu-lite.json$'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 7
